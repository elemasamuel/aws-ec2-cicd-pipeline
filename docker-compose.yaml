version: '3.9'
services:
    nodejs-app:
      image: elemasamuel/sam-repo:nodejs-cicd-jenkins-pipeline-project-${IMAGE_TAG}
      restart: unless-stopped
      ports:
        - 3000:3000
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
        interval: 30s
        timeout: 5s
        retries: 3
